image:
  name: hashicorp/terraform:latest
  entrypoint: [""]

stages:
  - backend
  - validate
  - plan
  - apply
  - show
  - destroy

before_script:
  - terraform -version

initializing backend:
  stage: backend
  script:
    - cd backend
    - terraform init
    - terraform apply --auto-approve -input=false
  artifacts:
    paths:
      - backend/terraform.tfstate
    expire_in: 1 day

checking code:
  stage: validate
  script:
  - terraform init
  - terraform fmt
  - terraform validate

planning code:
  stage: plan
  script:
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
    - tfplan
    expire_in: 10 minutes

deploying code:
  stage: apply
  script:
    - terraform init
    - terraform apply --auto-approve tfplan
  dependencies:
    - planning code

success:
  stage: apply
  script:
    - echo "automation successfull"
  when: on_success
  dependencies:
    - deploying code
    
failed:
  stage: apply
  script:
    - terraform init
    - terraform destroy --auto-approve -input=false
    - echo "automation failed"
  when: on_failure
  dependencies:
    - deploying code
    
show jobs:
  stage: show
  script:
    - terraform init
    - terraform state list
    
delete code:
  stage: destroy
  script:
    - terraform init
    - terraform destroy --auto-approve -input=false
    - cd backend
    - terraform init
    - terraform destroy --auto-approve -input=false
  dependencies:
    - initializing backend
  when: manual

after_script:
  - echo "automation completed"
